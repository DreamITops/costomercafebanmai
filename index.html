<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งอาหาร</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style> .menu-img { height: 150px; object-fit: cover; width: 100%; } </style>
</head>
<body>
    <div class="category-bar">
    <div class="cat-item active" onclick="filter('all')">🔥 ทั้งหมด</div>
    <div class="cat-item" onclick="filter('สเต็ก')">🥩 สเต็ก</div>
    <div class="cat-item" onclick="filter('เบอร์เกอร์')">🍔 เบอร์เกอร์</div>
    <div class="cat-item" onclick="filter('เครื่องดื่ม')">🥤 เครื่องดื่ม</div>
</div>

<div id="menu-grid" class="row g-3"></div>

<div class="modal fade" id="optionModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-body text-center">
        <img id="opt-img" src="" class="img-fluid rounded mb-3" style="max-height: 200px;">
        <h4 id="opt-name" class="fw-bold"></h4>
        <div id="options-container" class="text-start mt-3">
            </div>
        <button class="btn btn-primary w-100 mt-4 p-3 fw-bold" onclick="confirmToCart()">บันทึก</button>
      </div>
    </div>
  </div>
</div>

<script>
let selectedItem = null;
let currentOptions = [];

// ฟังก์ชันเมื่อกดปุ่ม [+] สีเหลือง (เหมือนรูป 7)
function openOptions(id) {
    selectedItem = allMenu.find(m => m.id == id);
    if (!selectedItem.options || selectedItem.options.length === 0) {
        addToCart(selectedItem, []); // ถ้าไม่มีออพชั่น ให้เข้าตะกร้าเลย
        return;
    }
    
    // แสดง Modal เลือกออพชั่น (เหมือนรูป 5)
    document.getElementById('opt-name').innerText = selectedItem.name;
    document.getElementById('opt-img').src = selectedItem.image_url;
    
    let html = '<h6>ตัวเลือกเสริม</h6>';
    selectedItem.options.forEach((opt, i) => {
        html += `
            <div class="d-flex justify-content-between align-items-center mb-2 border p-2 rounded">
                <div>
                    <input type="radio" name="food_opt" id="opt${i}" value='${JSON.stringify(opt)}' ${i==0?'checked':''}>
                    <label for="opt${i}">${opt.name}</label>
                </div>
                <span class="text-danger">+${opt.price} ฿</span>
            </div>`;
    });
    document.getElementById('options-container').innerHTML = html;
    new bootstrap.Modal(document.getElementById('optionModal')).show();
}

function confirmToCart() {
    const selectedOpt = JSON.parse(document.querySelector('input[name="food_opt"]:checked').value);
    addToCart(selectedItem, [selectedOpt]);
    bootstrap.Modal.getInstance(document.getElementById('optionModal')).hide();
}
</script>
</body>
</html>
